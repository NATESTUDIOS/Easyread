name: Keep API Alive

# ─────────────────────────────────────────────
# ⚙️  CONFIG — edit these values
# ─────────────────────────────────────────────
# Schedule (cron format, UTC):
#   ┌─ minute (0-59)
#   │ ┌─ hour (0-23)
#   │ │ ┌─ day of month (1-31)
#   │ │ │ ┌─ month (1-12)
#   │ │ │ │ ┌─ day of week (0-6, Sun=0)
#   │ │ │ │ │
#   │ │ │ │ │
#   * * * * *
#
# Examples:
#   '0 6 */2 * *'   → every 2 days at 06:00 UTC
#   '0 */6 * * *'   → every 6 hours
#   '0 9 * * 1-5'   → weekdays at 09:00 UTC
# ─────────────────────────────────────────────
on:
  schedule:
    - cron: '0 6 */2 * *'   # 👈 CHANGE SCHEDULE HERE
  workflow_dispatch:

env:
  API_NAME: "My API"
  API_URL: "https://example.com/api/health"
  API_KEY: "your-api-key-here"
  EXPECTED_STATUS: "200"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Endpoint
        run: |
          echo "Pinging $API_NAME to prevent auto-pause..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$API_URL" \
            -H "Authorization: Bearer $API_KEY")
          echo "Response status: $STATUS"
          if [ "$STATUS" = "$EXPECTED_STATUS" ] || [ "$STATUS" = "206" ]; then
            echo "✅ $API_NAME is alive and responding"
          else
            echo "⚠️ Unexpected status: $STATUS"
            exit 1
          fi