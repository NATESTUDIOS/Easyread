<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>EasyRead | Feed</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        *:focus-visible { outline: 2px solid #f59847; outline-offset: 2px; }

        :root {
            --bg-color: #f6f7f9;
            --bg-glow: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.9) 0%, transparent 70%);
            --text-main: #1c1c1e;
            --text-muted: #5c5c60;
            --text-placeholder: #c7c7cc;
            --card-bg: rgba(242, 242, 247, 0.75);
            --card-bg-hover: rgba(230, 230, 235, 0.88);
            --card-blur: blur(20px);
            --glass-border: 1.5px solid rgba(0, 0, 0, 0.12);
            --glass-border-subtle: 1px solid rgba(0, 0, 0, 0.08);
            --glass-shadow: 0 10px 30px rgba(0,0,0,0.05);
            --mode-bg: rgba(0, 0, 0, 0.04);
            --mode-text: #5f5f5f;
            --accent-color: #f59847;
            --pill-arrow: rgba(0, 0, 0, 0.06);
            --divider: rgba(0,0,0,0.08);
            --list-text: #1c1c1e;
            --shimmer-base: rgba(0, 0, 0, 0.06);
            --shimmer-highlight: rgba(0, 0, 0, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --bg-glow: radial-gradient(circle at 50% 0%, rgba(40, 40, 42, 0.4) 0%, transparent 60%);
                --text-main: #e8e8ea;
                --text-muted: #9a9a9e;
                --text-placeholder: #6c6c70;
                --card-bg: rgba(18, 18, 18, 0.65);
                --card-bg-hover: rgba(28, 28, 28, 0.8);
                --card-blur: blur(16px);
                --glass-border: 1px solid rgba(255, 255, 255, 0.08);
                --glass-border-subtle: 1px solid rgba(255, 255, 255, 0.04);
                --glass-shadow: 0 8px 32px rgba(0,0,0,0.6);
                --mode-bg: rgba(44, 44, 46, 0.5);
                --mode-text: #a0a0a4;
                --accent-color: #f59847;
                --pill-arrow: #3a3a3c;
                --divider: rgba(255,255,255,0.06);
                --list-text: #c0c0c4;
                --shimmer-base: rgba(255, 255, 255, 0.04);
                --shimmer-highlight: rgba(255, 255, 255, 0.08);
            }
        }

        [data-theme="light"] {
            --bg-color: #f6f7f9 !important;
            --text-main: #1c1c1e !important;
            --text-muted: #5c5c60 !important;
            --text-placeholder: #c7c7cc !important;
            --card-bg: rgba(242, 242, 247, 0.75) !important;
            --card-bg-hover: rgba(230, 230, 235, 0.88) !important;
            --glass-border: 1.5px solid rgba(0, 0, 0, 0.12) !important;
            --glass-border-subtle: 1px solid rgba(0, 0, 0, 0.08) !important;
            --glass-shadow: 0 10px 30px rgba(0,0,0,0.05) !important;
            --mode-bg: rgba(0, 0, 0, 0.04) !important;
            --mode-text: #5f5f5f !important;
            --pill-arrow: rgba(0, 0, 0, 0.06) !important;
            --divider: rgba(0,0,0,0.08) !important;
            --list-text: #1c1c1e !important;
            --shimmer-base: rgba(0, 0, 0, 0.06) !important;
            --shimmer-highlight: rgba(0, 0, 0, 0.12) !important;
        }

        [data-theme="dark"] {
            --bg-color: #000000 !important;
            --text-main: #e8e8ea !important;
            --text-muted: #9a9a9e !important;
            --text-placeholder: #6c6c70 !important;
            --card-bg: rgba(18, 18, 18, 0.65) !important;
            --glass-border: 1px solid rgba(255, 255, 255, 0.08) !important;
            --glass-border-subtle: 1px solid rgba(255, 255, 255, 0.04) !important;
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.6) !important;
            --mode-bg: rgba(44, 44, 46, 0.5) !important;
            --mode-text: #a0a0a4 !important;
            --pill-arrow: #3a3a3c !important;
            --divider: rgba(255,255,255,0.06) !important;
            --list-text: #c0c0c4 !important;
            --shimmer-base: rgba(255, 255, 255, 0.04) !important;
            --shimmer-highlight: rgba(255, 255, 255, 0.08) !important;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--bg-glow);
            background-repeat: no-repeat;
            background-size: 100% 400px;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 0 4rem 0;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-container {
            max-width: 440px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Header (compact) --- */
        .header {
            width: 100%;
            padding: 0.9rem 1rem 0.4rem 1rem;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .header-title .accent { color: var(--accent-color); }

        .header-actions { display: flex; gap: 8px; align-items: center; }
        .header-icon {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: var(--mode-bg);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
            border: none;
        }
        .header-icon:active { transform: scale(0.9); }
        .header-icon svg { width: 16px; height: 16px; fill: currentColor; stroke: currentColor; stroke-width: 0.5; }

        /* --- Content Area --- */
        .content-area {
            width: 100%;
            padding: 0 1rem 1rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* --- Search Bar (compact) --- */
        .search-container { width: 100%; }
        .search-bar {
            display: flex; align-items: center;
            background: var(--card-bg);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            border: var(--glass-border);
            border-radius: 32px;
            padding: 0.5rem 1rem;
            box-shadow: var(--glass-shadow);
            transition: all 0.2s ease;
        }
        .search-bar:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(245, 152, 71, 0.12);
        }
        .search-bar svg { 
            width: 16px; height: 16px; 
            fill: none; stroke: var(--text-placeholder); 
            stroke-width: 2.2; margin-right: 10px; flex-shrink: 0; 
        }
        .search-bar input {
            width: 100%; background: transparent; border: none; outline: none;
            font-family: inherit; font-size: 0.85rem; font-weight: 500; color: var(--text-main);
        }
        .search-bar input::placeholder { color: var(--text-placeholder); }

        /* Search active state */
        .search-bar.searching {
            border-color: var(--accent-color);
        }

        /* Clear button */
        .search-clear-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-placeholder);
            cursor: pointer;
            padding: 0 0 0 8px;
            font-size: 1.1rem;
            line-height: 1;
        }
        .search-clear-btn.visible { display: block; }

        /* --- Hero Card (compact) --- */
        .hero-card {
            width: 100%;
            height: 260px;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: var(--glass-border);
            box-shadow: var(--glass-shadow);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: flex-end;
            cursor: pointer;
        }
        .hero-card:active { transform: scale(0.98); }

        .hero-card .bg-gradient-mesh {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hero-card:hover .bg-gradient-mesh { transform: scale(1.03); }
        .hero-card .overlay-gradient {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.4) 40%, rgba(0,0,0,0.85) 100%); 
            z-index: 2;
        }
        .hero-text-content {
            position: relative; width: 100%; padding: 1.2rem 1rem; z-index: 3;
            color: #ffffff; display: flex; flex-direction: column; gap: 0.35rem;
        }
        .hero-meta-row { display: flex; align-items: center; gap: 8px; margin-bottom: 0.1rem; }
        .hero-tag {
            background: rgba(255,255,255,0.2); backdrop-filter: blur(8px);
            padding: 0.2rem 0.6rem; border-radius: 30px; font-size: 0.65rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.6px; border: 1px solid rgba(255,255,255,0.15);
        }
        .hero-icon {
            width: 26px; height: 26px; background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px); border-radius: 8px;
            display: flex; align-items: center; justify-content: center; 
            border: 1px solid rgba(255,255,255,0.15);
        }
        .hero-icon svg { width: 13px; height: 13px; fill: none; stroke: #fff; stroke-width: 2.2; }

        .hero-text-content h2 { 
            font-size: 1.2rem; font-weight: 800; line-height: 1.25; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.5); letter-spacing: -0.3px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .hero-lead { 
            font-size: 0.75rem; font-weight: 600; color: var(--accent-color); 
            text-shadow: 0 1px 4px rgba(0,0,0,0.4); 
        }
        .hero-description { 
            font-size: 0.75rem; line-height: 1.45; opacity: 0.9; font-weight: 400; 
            text-shadow: 0 1px 4px rgba(0,0,0,0.4); margin-top: 0.1rem;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* --- Category Pills (compact) --- */
        .categories-scroll {
            width: 100%; display: flex; gap: 6px; overflow-x: auto;
            padding-bottom: 4px; scroll-snap-type: x mandatory; 
            -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .categories-scroll::-webkit-scrollbar { display: none; }

        .category-pill {
            flex: 0 0 auto; scroll-snap-align: start;
            background: var(--card-bg); backdrop-filter: var(--card-blur);
            color: var(--text-muted); padding: 0.45rem 1rem; border-radius: 32px;
            font-size: 0.75rem; font-weight: 600; border: var(--glass-border-subtle);
            cursor: pointer; transition: all 0.2s ease;
        }
        .category-pill:active { transform: scale(0.95); }
        .category-pill.active { 
            background: var(--accent-color) !important; 
            color: #fff !important; 
            border-color: var(--accent-color) !important; 
        }
        .category-pill:hover { transform: translateY(-1px); background: var(--card-bg-hover); color: var(--text-main); }

        /* --- Article List (compact) --- */
        .article-list {
            display: flex; flex-direction: column; gap: 0.5rem; padding-top: 0.3rem;
        }
        .article-item {
            background: transparent; border: none;
            padding: 0.4rem 0; display: flex; align-items: center; gap: 12px;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            animation: fadeSlideUp 0.3s ease forwards;
            width: 100%; text-align: left;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .article-item:active { transform: scale(0.97); }
        .article-item:hover { transform: translateX(3px); opacity: 0.9; }

        .article-icon {
            width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; color: #fff;
            transition: transform 0.2s;
        }
        .article-item:active .article-icon { transform: scale(0.9); }
        .article-icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; }

        .article-content { flex: 1; min-width: 0; }
        .article-title { 
            font-size: 0.85rem; font-weight: 700; margin-bottom: 0.15rem; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
            color: var(--text-main); 
        }
        .article-subtitle { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }
        .article-meta { 
            font-size: 0.65rem; color: var(--text-placeholder); margin-top: 0.15rem; 
            display: flex; align-items: center; gap: 5px; font-weight: 500; 
        }
        .article-meta .dot { width: 2px; height: 2px; border-radius: 50%; background: var(--text-placeholder); }
        .article-action {
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--pill-arrow); display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: all 0.2s;
        }
        .article-item:hover .article-action { background: var(--mode-bg); transform: scale(1.05); }
        .article-action svg { width: 12px; height: 12px; fill: none; stroke: var(--text-placeholder); stroke-width: 2.2; }

        /* --- Empty State --- */
        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-muted);
            width: 100%;
        }
        .empty-state h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.3rem;
        }
        .empty-state p {
            font-size: 0.78rem;
            line-height: 1.5;
        }

        /* --- Beautiful Shimmer Loading --- */
        .shimmer-element {
            position: relative;
            overflow: hidden;
            background: var(--shimmer-base);
            border-radius: 4px;
        }
        .shimmer-element::after {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                transparent 0%,
                var(--shimmer-highlight) 50%,
                transparent 100%
            );
            animation: shimmerSwipe 1.4s infinite;
            content: '';
        }
        @keyframes shimmerSwipe {
            100% { transform: translateX(100%); }
        }

        .skeleton-container {
            display: flex; flex-direction: column; gap: 0.5rem; padding-top: 0.3rem;
        }
        .shimmer-card-wrapper {
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.4rem 0;
            width: 100%;
        }
        .shimmer-element.circle {
            width: 38px; height: 38px;
            border-radius: 11px;
        }
        .shimmer-element.line-title {
            width: 65%; height: 12px;
            margin-bottom: 6px;
        }
        .shimmer-element.line-meta {
            width: 40%; height: 10px;
        }
        .shimmer-element.line-arrow {
            width: 28px; height: 28px;
            border-radius: 50%;
        }

        /* Hero shimmer */
        .hero-shimmer {
            width: 100%;
            height: 260px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            background: var(--card-bg);
            border: var(--glass-border);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1.2rem 1rem;
            gap: 8px;
        }

        /* Search results info */
        .search-results-info {
            font-size: 0.7rem;
            color: var(--text-muted);
            padding: 0.2rem 0.3rem;
            display: none;
        }
        .search-results-info.visible { display: block; }

        /* --- Dialog --- */
        .dialog-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        [data-theme="dark"] .dialog-overlay { background: rgba(0, 0, 0, 0.55); }
        .dialog-overlay.active { opacity: 1; pointer-events: auto; }
        .glass-dialog {
            background: var(--card-bg);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            border: var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.15);
            transform: scale(0.9) translateY(10px);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-align: center;
        }
        .dialog-overlay.active .glass-dialog { transform: scale(1) translateY(0); }
        .dialog-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .dialog-title { font-size: 16px; font-weight: 700; color: var(--text-main); }
        .dialog-close {
            background: none; border: none; font-size: 20px;
            color: var(--text-secondary); cursor: pointer; line-height: 1; padding: 4px;
        }
        .auth-submit-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: var(--accent-color);
            border: none;
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(245, 152, 71, 0.25);
            transition: all 0.2s;
        }
        .auth-submit-btn:active { transform: scale(0.98); }

        @media (max-width: 380px) {
            .header { padding: 0.8rem 0.9rem 0.3rem 0.9rem; }
            .content-area { padding: 0 0.9rem 0.9rem 0.9rem; }
            .search-bar { padding: 0.45rem 0.9rem; }
            .search-bar input { font-size: 0.8rem; }
            .hero-card, .hero-shimmer { height: 230px; }
            .hero-text-content { padding: 1rem 0.9rem; }
            .hero-text-content h2 { font-size: 1.1rem; }
            .article-icon { width: 34px; height: 34px; border-radius: 10px; }
            .article-icon svg { width: 15px; height: 15px; }
            .article-title { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- Header -->
        <header class="header">
            <div class="header-title">EASY<span class="accent">READ</span></div>
            <div class="header-actions">
                <button class="header-icon" onclick="focusSearch()" title="Search" aria-label="Search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
                <button class="header-icon" onclick="openProfileTab()" title="Profile" aria-label="Profile">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </button>
            </div>
        </header>

        <main class="content-area">

            <!-- Search Bar -->
            <div class="search-container">
                <div class="search-bar" id="searchBar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" oninput="handleSearchInput()" placeholder="Search articles..." autocomplete="off" />
                    <button class="search-clear-btn" id="searchClearBtn" onclick="clearSearch()">✕</button>
                </div>
                <div class="search-results-info" id="searchResultsInfo"></div>
            </div>

            <!-- Hero Card (hidden during search) -->
            <div class="hero-card" id="heroCard" style="display: none;">
                <div class="bg-gradient-mesh" id="heroGradientMesh"></div>
                <div class="overlay-gradient"></div>
                <div class="hero-text-content" id="heroTextContent"></div>
            </div>

            <!-- Hero Shimmer -->
            <div class="hero-shimmer" id="heroShimmer">
                <span class="shimmer-element" style="width: 70px; height: 18px; border-radius: 20px;"></span>
                <span class="shimmer-element" style="width: 55%; height: 22px;"></span>
                <span class="shimmer-element" style="width: 35%; height: 14px;"></span>
                <span class="shimmer-element" style="width: 85%; height: 12px;"></span>
                <span class="shimmer-element" style="width: 65%; height: 12px;"></span>
            </div>

            <!-- Category Pills -->
            <div class="categories-scroll" id="categoryScrollContainer">
                <button class="category-pill active" onclick="filterCategory('All', this)">For you</button>
            </div>

            <!-- Article List Container -->
            <div id="articleContainer">
                <!-- Skeleton Loader -->
                <div class="skeleton-container" id="skeletonLoader">
                    <div class="shimmer-card-wrapper">
                        <div class="shimmer-element circle"></div>
                        <div style="flex:1;">
                            <div class="shimmer-element line-title"></div>
                            <div class="shimmer-element line-meta"></div>
                        </div>
                        <div class="shimmer-element line-arrow"></div>
                    </div>
                    <div class="shimmer-card-wrapper">
                        <div class="shimmer-element circle"></div>
                        <div style="flex:1;">
                            <div class="shimmer-element line-title"></div>
                            <div class="shimmer-element line-meta"></div>
                        </div>
                        <div class="shimmer-element line-arrow"></div>
                    </div>
                    <div class="shimmer-card-wrapper">
                        <div class="shimmer-element circle"></div>
                        <div style="flex:1;">
                            <div class="shimmer-element line-title"></div>
                            <div class="shimmer-element line-meta"></div>
                        </div>
                        <div class="shimmer-element line-arrow"></div>
                    </div>
                    <div class="shimmer-card-wrapper">
                        <div class="shimmer-element circle"></div>
                        <div style="flex:1;">
                            <div class="shimmer-element line-title"></div>
                            <div class="shimmer-element line-meta"></div>
                        </div>
                        <div class="shimmer-element line-arrow"></div>
                    </div>
                    <div class="shimmer-card-wrapper">
                        <div class="shimmer-element circle"></div>
                        <div style="flex:1;">
                            <div class="shimmer-element line-title"></div>
                            <div class="shimmer-element line-meta"></div>
                        </div>
                        <div class="shimmer-element line-arrow"></div>
                    </div>
                </div>
                <!-- Content List -->
                <div class="article-list" id="articleList" style="display: none;"></div>
            </div>

        </main>
    </div>

    <!-- Error Dialog -->
    <div class="dialog-overlay" id="errorDialog">
        <div class="glass-dialog">
            <div class="dialog-header">
                <h3 class="dialog-title">Connection Error</h3>
                <button class="dialog-close" onclick="closeDialog('errorDialog')">&times;</button>
            </div>
            <div style="padding: 10px 0; text-align: center;">
                <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(255, 59, 48, 0.1); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; color: #ff3b30;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.5"></path><path d="M5 12.5a10.94 10.94 0 0 1 5.17-2.39"></path><path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
                </div>
                <p style="font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 16px;" id="errorDialogMessage">
                    Unable to connect to the EasyRead API. Please check your connection and try again.
                </p>
                <button class="auth-submit-btn" onclick="retryLastAction()">Retry</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://easytoread.vercel.app/api';

        let fetchedArticles = [];
        let activeCategory = 'All';
        let lastFailedAction = null;
        let searchDebounceTimer = null;
        let isSearching = false;

        // Dynamic vector icons
        const dynamicIcons = {
            trend: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 11 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>`,
            dollar: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>`,
            computer: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>`,
            globe: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>`,
            book: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>`,
            analytics: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>`
        };
        const listIcons = [dynamicIcons.trend, dynamicIcons.dollar, dynamicIcons.computer, dynamicIcons.globe, dynamicIcons.analytics, dynamicIcons.book];

        const gradientPalettes = [
            'linear-gradient(135deg, #f59847, #ffb067)',
            'linear-gradient(135deg, #20c997, #198754)',
            'linear-gradient(135deg, #0d6efd, #0a58ca)',
            'linear-gradient(135deg, #e83e8c, #b8216b)',
            'linear-gradient(135deg, #6f42c1, #522c97)'
        ];

        function getRandomGradient(index) {
            return gradientPalettes[index % gradientPalettes.length];
        }

        function getMeshGradient() {
            const palettes = [
                'radial-gradient(circle at 0% 0%, #ffd3b6 0%, transparent 50%), radial-gradient(circle at 100% 100%, #ffaaa5 0%, transparent 50%), linear-gradient(135deg, #f59847, #d4e5f7)',
                'radial-gradient(circle at 0% 100%, #1f130f 0%, transparent 60%), radial-gradient(circle at 100% 0%, #30170a 0%, transparent 60%), linear-gradient(135deg, #c49a45, #12161f)'
            ];
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark' || 
                           (!document.documentElement.getAttribute('data-theme') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            return isDark ? palettes[1] : palettes[0];
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // --- Theme System ---
        let currentThemeSetting = 'auto';

        function applyTheme(theme) {
            currentThemeSetting = theme;
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            const mesh = document.getElementById('heroGradientMesh');
            if (mesh) mesh.style.background = getMeshGradient();
        }

        applyTheme(localStorage.getItem('easyread-theme') || 'auto');

        window.addEventListener('storage', (event) => {
            if (event.key === 'easyread-theme') {
                applyTheme(event.newValue || 'auto');
            }
        });

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'themeChanged') {
                applyTheme(event.data.theme);
            }
        });

        // --- Dialog Operations ---
        function showErrorDialog(message, retryCallback) {
            document.getElementById('errorDialogMessage').textContent = message;
            lastFailedAction = retryCallback;
            openDialog('errorDialog');
        }

        function retryLastAction() {
            closeDialog('errorDialog');
            if (lastFailedAction && typeof lastFailedAction === 'function') {
                lastFailedAction();
            }
        }

        function openDialog(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeDialog(id) {
            document.getElementById(id).classList.remove('active');
        }

        function openProfileTab() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'switchTab', tab: 'profile' }, '*');
            } else {
                window.location.href = '/#profile';
            }
        }

        // --- Fetch Dynamic Articles ---
        async function fetchArticlesList() {
            const container = document.getElementById('articleList');
            const skeleton = document.getElementById('skeletonLoader');
            const heroCard = document.getElementById('heroCard');
            const heroShimmer = document.getElementById('heroShimmer');

            skeleton.style.display = 'flex';
            container.style.display = 'none';
            heroCard.style.display = 'none';
            heroShimmer.style.display = 'flex';

            try {
                const response = await fetch(`${API_BASE_URL}/article?action=list&limit=50`);
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                const data = await response.json();

                fetchedArticles = Array.isArray(data) ? data : (data.articles || []);

                renderFeaturedHero();
                renderFilteredArticlesList();
            } catch (err) {
                console.error('Failed to load articles:', err);
                skeleton.style.display = 'none';
                heroShimmer.style.display = 'none';
                showErrorDialog('Unable to load articles from the database. Please try again.', fetchArticlesList);
            }
        }

        // Render Hero Card
        function renderFeaturedHero() {
            const heroCard = document.getElementById('heroCard');
            const heroShimmer = document.getElementById('heroShimmer');
            const heroTextContent = document.getElementById('heroTextContent');
            const mesh = document.getElementById('heroGradientMesh');

            if (fetchedArticles.length === 0) {
                heroShimmer.style.display = 'none';
                heroCard.style.display = 'none';
                return;
            }

            // Don't show hero during search
            if (isSearching) {
                heroShimmer.style.display = 'none';
                heroCard.style.display = 'none';
                return;
            }

            const heroArticle = fetchedArticles[0];
            mesh.style.background = getMeshGradient();

            const sourceDomain = heroArticle.source_domain || 'EasyRead';
            const readTime = heroArticle.reading_time || Math.max(1, Math.ceil((heroArticle.word_count || 300) / 200));

            heroTextContent.innerHTML = `
                <div class="hero-meta-row">
                    <span class="hero-tag">Featured</span>
                    <div class="hero-icon">${dynamicIcons.analytics}</div>
                </div>
                <h2>${escapeHtml(heroArticle.canonical_title)}</h2>
                <p class="hero-lead">By ${escapeHtml(sourceDomain)} · ${readTime} min read</p>
                <p class="hero-description">${escapeHtml(heroArticle.summary || 'Explore this simplified article and personalized perspectives.')}</p>
            `;

            heroCard.onclick = () => openArticle(heroArticle);
            heroShimmer.style.display = 'none';
            heroCard.style.display = 'flex';
        }

        // Render filtered articles
        function renderFilteredArticlesList() {
            const container = document.getElementById('articleList');
            const skeleton = document.getElementById('skeletonLoader');

            skeleton.style.display = 'none';
            container.style.display = 'flex';
            container.innerHTML = '';

            const filtered = activeCategory === 'All' 
                ? fetchedArticles 
                : fetchedArticles.filter(art => Array.isArray(art.categories) && art.categories.includes(activeCategory));

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No articles found</h3>
                        <p>${activeCategory === 'All' ? 'No articles are available yet.' : `No articles found in the "${escapeHtml(activeCategory)}" category.`}</p>
                    </div>
                `;
                return;
            }

            filtered.forEach((art, index) => {
                const randomIcon = listIcons[index % listIcons.length];
                const readTime = art.reading_time || Math.max(1, Math.ceil((art.word_count || 300) / 200));
                const sourceDomain = art.source_domain || 'EasyRead';
                const views = art.view_count || 0;

                const item = document.createElement('button');
                item.className = 'article-item';
                item.onclick = () => openArticle(art);
                item.innerHTML = `
                    <div class="article-icon" style="background: ${getRandomGradient(index)};">${randomIcon}</div>
                    <div class="article-content">
                        <div class="article-title">${escapeHtml(art.canonical_title)}</div>
                        <div class="article-subtitle">By ${escapeHtml(sourceDomain)}</div>
                        <div class="article-meta">
                            ${views} view${views === 1 ? '' : 's'} 
                            <span class="dot"></span> 
                            ${readTime} min read
                        </div>
                    </div>
                    <div class="article-action">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // --- SERVER-SIDE SEARCH ---
        async function performSearch(query) {
            const container = document.getElementById('articleList');
            const skeleton = document.getElementById('skeletonLoader');
            const heroCard = document.getElementById('heroCard');
            const heroShimmer = document.getElementById('heroShimmer');
            const searchResultsInfo = document.getElementById('searchResultsInfo');

            // Hide hero during search
            heroCard.style.display = 'none';
            heroShimmer.style.display = 'none';

            // Show loading shimmer
            skeleton.style.display = 'flex';
            container.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE_URL}/article?action=search&search=${encodeURIComponent(query)}&limit=30`);
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                const data = await response.json();

                const results = data.articles || [];

                skeleton.style.display = 'none';
                container.style.display = 'flex';
                container.innerHTML = '';

                // Show results count
                searchResultsInfo.textContent = `${results.length} result${results.length === 1 ? '' : 's'} for "${escapeHtml(query)}"`;
                searchResultsInfo.classList.add('visible');

                if (results.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>No matches found</h3>
                            <p>No articles matched "${escapeHtml(query)}". Try another search keyword.</p>
                        </div>
                    `;
                    return;
                }

                results.forEach((art, index) => {
                    const randomIcon = listIcons[index % listIcons.length];
                    const readTime = art.reading_time || Math.max(1, Math.ceil((art.word_count || 300) / 200));
                    const sourceDomain = art.source_domain || 'EasyRead';
                    const views = art.view_count || 0;

                    const item = document.createElement('button');
                    item.className = 'article-item';
                    item.onclick = () => openArticle(art);
                    item.innerHTML = `
                        <div class="article-icon" style="background: ${getRandomGradient(index)};">${randomIcon}</div>
                        <div class="article-content">
                            <div class="article-title">${escapeHtml(art.canonical_title)}</div>
                            <div class="article-subtitle">By ${escapeHtml(sourceDomain)}</div>
                            <div class="article-meta">${views} views <span class="dot"></span> ${readTime} min read</div>
                        </div>
                        <div class="article-action">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (err) {
                console.error('Search failed:', err);
                skeleton.style.display = 'none';
                container.style.display = 'flex';
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>Search failed</h3>
                        <p>Unable to search articles. Please try again.</p>
                    </div>
                `;
            }
        }

        // Handle search input with debounce
        function handleSearchInput() {
            const query = document.getElementById('searchInput').value.trim();
            const clearBtn = document.getElementById('searchClearBtn');
            const searchBar = document.getElementById('searchBar');

            clearBtn.classList.toggle('visible', query.length > 0);

            if (query.length === 0) {
                isSearching = false;
                searchBar.classList.remove('searching');
                document.getElementById('searchResultsInfo').classList.remove('visible');
                
                // Restore hero and normal list
                renderFeaturedHero();
                renderFilteredArticlesList();
                return;
            }

            isSearching = true;
            searchBar.classList.add('searching');

            // Debounce search requests
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                performSearch(query);
            }, 400);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClearBtn').classList.remove('visible');
            document.getElementById('searchBar').classList.remove('searching');
            document.getElementById('searchResultsInfo').classList.remove('visible');
            isSearching = false;
            
            renderFeaturedHero();
            renderFilteredArticlesList();
        }

        function focusSearch() {
            const input = document.getElementById('searchInput');
            if (input) {
                input.focus();
                input.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // Category Filter
        function filterCategory(category, buttonElement) {
            activeCategory = category;
            document.querySelectorAll('.category-pill').forEach(pill => pill.classList.remove('active'));
            if (buttonElement) buttonElement.classList.add('active');

            // If searching, don't show category filter
            const searchQuery = document.getElementById('searchInput').value.trim();
            if (searchQuery) return;

            renderFilteredArticlesList();
        }

        // Article navigation
        function openArticle(article) {
            if (!article) return;

            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ 
                    type: 'openArticle', 
                    slug: article.slug,
                    article_id: article.article_id
                }, '*');
            } else {
                const targetUrl = article.slug ? `/view?slug=${encodeURIComponent(article.slug)}` : `/view?id=${encodeURIComponent(article.article_id)}`;
                window.location.href = targetUrl;
            }
        }

        // Fetch Categories
        async function fetchCategoriesList() {
            const container = document.getElementById('categoryScrollContainer');
            if (!container) return;

            try {
                const response = await fetch(`${API_BASE_URL}/category`);
                if (!response.ok) throw new Error();
                const data = await response.json();
                const categories = Array.isArray(data) ? data : (data.categories || []);

                let pillsHtml = `<button class="category-pill ${activeCategory === 'All' ? 'active' : ''}" onclick="filterCategory('All', this)">For you</button>`;

                categories.forEach(cat => {
                    const name = typeof cat === 'string' ? cat : (cat.name || cat.canonical_name || cat.category_name);
                    if (name) {
                        const isActive = activeCategory.toLowerCase() === name.toLowerCase();
                        pillsHtml += `<button class="category-pill ${isActive ? 'active' : ''}" onclick="filterCategory('${escapeHtml(name)}', this)">${escapeHtml(name)}</button>`;
                    }
                });

                container.innerHTML = pillsHtml;
            } catch (err) {
                container.innerHTML = `<button class="category-pill active" onclick="filterCategory('All', this)">For you</button>`;
            }
        }

        // Listen for parent category selection broadcasts
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'filterCategory') {
                const targetCategory = event.data.category;
                const targetBtn = Array.from(document.querySelectorAll('.category-pill'))
                    .find(btn => btn.textContent.toLowerCase() === targetCategory.toLowerCase());
                if (targetBtn) {
                    filterCategory(targetCategory === 'For you' ? 'All' : targetCategory, targetBtn);
                }
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            fetchCategoriesList();
            fetchArticlesList();
        });
    </script>
</body>
</html>
